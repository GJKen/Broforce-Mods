<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Broforce Online Diagnostics - UMM 设置预览</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #17191d;
      --surface: #22252a;
      --surface-raised: #292c31;
      --control: #30343a;
      --control-hover: #383d44;
      --control-active: #484f59;
      --border: #4b5059;
      --text: #e4e7eb;
      --muted: #aeb4bd;
      --workshop: #67d990;
      --frp: #f2b451;
      --logs: #64c5f5;
      --focus: #8bd7fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--text);
      font: 14px/1.45 "Segoe UI", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(760px, calc(100% - 32px));
      margin: 28px auto;
      padding: 20px;
      border: 1px solid #3c4047;
      border-radius: 4px;
      background: var(--surface);
      box-shadow: 0 10px 32px rgb(0 0 0 / 24%);
    }

    .window-title {
      margin: 0 0 18px;
      font-size: 16px;
      font-weight: 600;
    }

    .section { margin: 0 0 10px; }

    .section-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 40px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--control);
      color: inherit;
      font: inherit;
      font-size: 15px;
      font-weight: 650;
      text-align: left;
      cursor: pointer;
    }

    .section-toggle:hover { background: var(--control-hover); }
    .section-toggle:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    .indicator {
      position: relative;
      width: 16px;
      height: 12px;
      flex: 0 0 auto;
    }

    .indicator::before {
      position: absolute;
      left: 2px;
      top: 0;
      width: 0;
      height: 0;
      content: "";
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 8px solid #eceef1;
      transform-origin: 4px 6px;
      transition: transform 120ms ease;
    }

    .section-toggle[aria-expanded="true"] .indicator::before { transform: rotate(90deg); }
    .section.workshop .section-name { color: var(--workshop); }
    .section.frp .section-name { color: var(--frp); }
    .section.logs .section-name { color: var(--logs); }

    .section-content {
      padding: 13px 14px 16px;
      border: 1px solid #3b3f46;
      border-top: 0;
      background: var(--surface-raised);
    }

    .section-content[hidden] { display: none; }

    label, .field-label {
      display: block;
      margin: 9px 0 5px;
      color: #c8ccd2;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
      color: #d9dce0;
    }

    input[type="checkbox"] {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: #6fbd8b;
    }

    input[type="text"], input[type="password"], input[type="number"] {
      width: min(320px, 100%);
      height: 30px;
      padding: 4px 8px;
      border: 1px solid #555b64;
      border-radius: 2px;
      background: #181a1e;
      color: var(--text);
      font: inherit;
    }

    .segments {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      width: min(320px, 100%);
    }

    .segments.player-limit { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .segments button, .preset-grid button, .apply {
      min-height: 32px;
      border: 1px solid #555b64;
      background: #353940;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    .segments button[aria-pressed="true"],
    .preset-grid button[aria-pressed="true"] {
      background: var(--control-active);
      border-color: #747c88;
      color: #fff;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(132px, 1fr));
      gap: 6px;
      width: min(540px, 100%);
    }

    .preset-grid button {
      padding: 6px 10px;
      border-radius: 2px;
      white-space: nowrap;
    }

    .apply {
      width: min(320px, 100%);
      margin-top: 12px;
      border-radius: 2px;
    }

    .status, .footer {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .footer { margin-bottom: 0; }

    @media (max-width: 560px) {
      main { width: calc(100% - 20px); margin: 10px auto; padding: 12px; }
      .preset-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .preset-grid button { white-space: normal; }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="window-title">Broforce Online Diagnostics 0.5.0</h1>

    <section class="section workshop">
      <button class="section-toggle" type="button" aria-expanded="true" aria-controls="workshop-content">
        <span class="indicator" aria-hidden="true"></span>
        <span class="section-name">Workshop online</span>
      </button>
      <div class="section-content" id="workshop-content">
        <label class="check-row"><input type="checkbox" checked>Inject configured workshop map into online level switching</label>
        <label class="check-row"><input type="checkbox">Disable automatic AFK spectator mode in online games</label>
        <label>Workshop ID<input type="text" value="456121589"></label>
        <label>Workshop campaign name (optional)<input type="text"></label>
        <label>Custom level scene<input type="text" value="Test Evan2"></label>
      </div>
    </section>

    <section class="section frp">
      <button class="section-toggle" type="button" aria-expanded="false" aria-controls="frp-content">
        <span class="indicator" aria-hidden="true"></span>
        <span class="section-name">FRP Direct</span>
      </button>
      <div class="section-content" id="frp-content" hidden>
        <label class="check-row"><input type="checkbox" checked>Enable FRP Direct networking</label>
        <div class="field-label">FRP Direct role</div>
        <div class="segments" role="group" aria-label="FRP Direct role">
          <button type="button" aria-pressed="true">Host</button>
          <button type="button" aria-pressed="false">Client</button>
        </div>
        <label>Local UDP listen port<input type="number" value="27045"></label>
        <div class="field-label">FRP room player limit (applies immediately)</div>
        <div class="segments player-limit" role="group" aria-label="FRP room player limit">
          <button type="button" aria-pressed="false">1</button>
          <button type="button" aria-pressed="false">2</button>
          <button type="button" aria-pressed="false">3</button>
          <button type="button" aria-pressed="true">4</button>
        </div>
        <label>FRP room password (optional)<input type="password" value="preview"></label>
        <div class="status">FRP Direct status: Listening on UDP 27045</div>
      </div>
    </section>

    <section class="section logs">
      <button class="section-toggle" type="button" aria-expanded="false" aria-controls="logs-content">
        <span class="indicator" aria-hidden="true"></span>
        <span class="section-name">Diagnostic logs</span>
      </button>
      <div class="section-content" id="logs-content" hidden>
        <label>Diagnostic session ID<input type="text" value="test001"></label>
        <label>Diagnostic label<input type="text" value="host"></label>
        <div class="field-label">Diagnostic log preset</div>
        <div class="preset-grid" role="group" aria-label="Diagnostic log preset">
          <button type="button" aria-pressed="false">Basic</button>
          <button type="button" aria-pressed="false">Join / Rejoin</button>
          <button type="button" aria-pressed="true">AFK / Failure</button>
          <button type="button" aria-pressed="false">Workshop</button>
          <button type="button" aria-pressed="false">Full</button>
        </div>
        <div class="field-label">Diagnostic categories</div>
        <label class="check-row"><input type="checkbox" checked>Lobby and network session</label>
        <label class="check-row"><input type="checkbox" checked>Workshop download / load / scenes</label>
        <label class="check-row"><input type="checkbox" checked>Player join / spawn / dropout</label>
        <label class="check-row"><input type="checkbox" checked>AFK and Dropout</label>
        <label class="check-row"><input type="checkbox" checked>Lives / failure / level outcome</label>
        <label class="check-row"><input type="checkbox">Workshop items and object sync</label>
        <label class="check-row"><input type="checkbox">FRP Direct transport</label>
        <label class="check-row"><input type="checkbox">Optional Mod compatibility</label>
        <label class="check-row"><input type="checkbox">Harmony detailed tracing</label>
      </div>
    </section>

    <p class="footer">Changes are saved when UMM settings are saved, the Mod is toggled, or the game exits normally.</p>
  </main>

  <script>
    document.querySelectorAll('.section-toggle').forEach((button) => {
      button.addEventListener('click', () => {
        const expanded = button.getAttribute('aria-expanded') === 'true';
        button.setAttribute('aria-expanded', String(!expanded));
        document.getElementById(button.getAttribute('aria-controls')).hidden = expanded;
      });
    });

    document.querySelectorAll('.segments, .preset-grid').forEach((group) => {
      group.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        group.querySelectorAll('button').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
      });
    });
  </script>
</body>
</html>
